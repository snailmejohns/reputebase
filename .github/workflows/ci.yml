name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        working-directory: ./contracts
        run: forge install OpenZeppelin/openzeppelin-contracts

      - name: Run tests
        working-directory: ./contracts
        run: forge test -vvv --skip lib/openzeppelin-contracts/certora --skip lib/openzeppelin-contracts/test --skip lib/openzeppelin-contracts/mocks/crosschain

      - name: Build contracts
        working-directory: ./contracts
        run: forge build

      - name: Check formatting
        working-directory: ./contracts
        run: forge fmt --check || (echo "Code is not formatted. Run 'forge fmt' to fix." && exit 1)

  lint-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Check build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: test

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Run ESLint
        working-directory: ./api
        run: npm run lint

  lint-sdk:
    name: Lint SDK
    runs-on: ubuntu-latest
    if: hashFiles('sdk/js/**') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install dependencies
        working-directory: ./sdk/js
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./sdk/js
        run: npx tsc --noEmit || echo "TypeScript check skipped..."

